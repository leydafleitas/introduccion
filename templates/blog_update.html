{% extends "base.html" %}

{% block content %}

    <div class="min-h-screen bg-slate-50 flex items-center justify-center px-4">
        <div class="w-full max-w-2xl">

            <!-- Tarjeta -->
            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm">

                <!-- Título -->
                <div class="px-6 py-5 border-b border-slate-200">
                    <h1 class="text-xl font-semibold text-slate-900">
                        Editar post
                    </h1>
                    <p class="text-sm text-slate-500 mt-1">
                        Actualizá el título y el contenido del post
                    </p>
                </div>

                <!-- Form -->
                <form method="POST" class="p-6 space-y-6">
                    {% csrf_token %}

                    <!-- Título -->
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-slate-700">
                            Título
                        </label>
                        {{ form.title }}
                    </div>

                    <!-- Contenido -->
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-slate-700">
                            Contenido
                        </label>
                        {{ form.content }}
                    </div>

                    <!-- Acciones -->
                    <div class="px-6 py-4 border-t border-slate-200 flex justify-end gap-3">
                        <a href="{% url 'blog:home' %}"
                        class="rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">
                        Cancelar
                        </a>

                        <button type="submit"
                            class="rounded-xl bg-green-600 px-4 py-2 text-sm font-semibold text-white hover:bg-green-500">
                            Update
                        </button>
            
                    </div>
                </form>

            </div>
        </div>
    </div>

{% endblock content %}
