{% extends "base.html" %}
{% block content %}

<div class="min-h-screen bg-slate-50 flex items-center justify-center px-4">
  <div class="w-full max-w-lg">

    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm">

      <!-- Header -->
      <div class="px-6 py-5 border-b border-slate-200">
        <h1 class="text-xl font-semibold text-red-600">
          Confirmar eliminación
        </h1>
      </div>

      <!-- Body -->
      <div class="p-6">
        <p class="text-slate-700">
          ¿Estás seguro que deseas eliminar este post?
        </p>

        <div class="mt-3 p-4 bg-slate-50 rounded-xl border border-slate-200">
          <p class="text-sm text-slate-600 font-medium">
            {{ object.title }}
          </p>
        </div>
      </div>

      <!-- Actions -->
      <form method="POST" class="px-6 py-4 border-t border-slate-200 flex justify-end gap-3">
        {% csrf_token %}

        <a href="{% url 'blog:home' %}"
           class="rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">
          Cancelar
        </a>

        <button type="submit"
                class="rounded-xl bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-500">
          Eliminar
        </button>
      </form>

    </div>

  </div>
</div>

{% endblock content %}
