{% extends "base.html" %}
{% block content %}

<div class="min-h-screen bg-slate-50 flex items-center justify-center px-4">
  <div class="w-full max-w-2xl">

    <!-- Tarjeta del post -->
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm">

      <!-- Header del post -->
      <div class="px-6 py-5 border-b border-slate-200">
        <h1 class="text-2xl font-bold text-slate-900">
          {{ post.title }}
        </h1>
      </div>

      <!-- Contenido -->
      <div class="p-6">
        <div class="prose max-w-none text-slate-700">
          {{ post.content }}
        </div>
      </div>

      <!-- Acciones -->
      <div class="px-6 py-4 border-t border-slate-200 flex justify-end gap-3">
        <a href="{% url 'blog:update' post.id %}"
           class="rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">
          Editar
        </a>

        <a href="{% url 'blog:home' %}"
           class="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">
          Volver
        </a>
      </div>

    </div>

  </div>
</div>

{% endblock content %}
