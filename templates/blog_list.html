{% extends "base.html" %}

{% block content %}
blog list
<br>
{%for post in posts%}
<a href="{% url "blog:detail" post.id %}">{{post.title}}</a>
<a href="{% url 'blog:update' post.id %}">Update</a>
<a href="{% url "blog:delete" post.id%}">Delete</a>
{%endfor%}
<br>
<a
  href="{% url 'blog:create' %}"
  class="mt-6 inline-block
        text-white bg-gradient-to-r from-blue-500 via-blue-600 to-blue-700
         hover:bg-gradient-to-br focus:ring-4 focus:outline-none
         focus:ring-blue-300 font-medium rounded-md text-sm
         px-4 py-2.5 text-center leading-5"
>
  Create
</a>

{% endblock content %}
